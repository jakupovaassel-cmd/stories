<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>История как опора</title>
  <style>
    body {
      background: #07100b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    .box {
      max-width: 900px;
      margin: auto;
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 24px;
    }
    textarea, select, input {
      width: 100%;
      padding: 14px;
      margin: 10px 0 20px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }
    textarea {
      height: 180px;
    }
    button {
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
      background: rgba(0,0,0,0.35);
      padding: 24px;
      border-radius: 18px;
      white-space: pre-line;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>История как опора</h1>
    <p>Опишите ситуацию общими словами. Не указывайте личные данные, адреса, документы, пароли и конфиденциальную информацию.</p>

    <label>Ваша история</label>
    <textarea id="story" placeholder="Например: я долго боялась выходить в сторис, но начала с маленьких шагов..."></textarea>

    <label>Формат</label>
    <select id="format">
      <option value="hero">Путь героя</option>
      <option value="beforeafter">Было → Стало</option>
      <option value="case">Кейс</option>
      <option value="stories">Сторис</option>
    </select>

    <label>Для кого эта история?</label>
    <input id="audience" placeholder="Например: для экспертов, которые боятся вести блог">

    <button onclick="generateStory()">Собрать структуру</button>

    <div id="result">Здесь появится результат.</div>
  </div>

  <script>
    function generateStory() {
      const story = document.getElementById("story").value.trim();
      const format = document.getElementById("format").value;
      const audience = document.getElementById("audience").value.trim() || "для вашей аудитории";

      if (!story) {
        document.getElementById("result").innerText = "Напишите историю, чтобы я смогла собрать структуру.";
        return;
      }

      let result = "";

      if (format === "hero") {
        result =
`ФОРМАТ: ПУТЬ ГЕРОЯ

1. Было:
${story}

2. Вызов:
Что в этой ситуации стало для вас трудностью?

3. Сомнение:
Какие мысли, страхи или внутренние вопросы появились?

4. Действие:
Какой шаг вы сделали?

5. Изменение:
Что стало иначе после этого?

6. Смысл:
Какой вывод можно передать ${audience}?

7. Заготовка начала:
"Иногда важные перемены начинаются не с большого решения, а с честного взгляда на свою ситуацию..."`;
      }

      if (format === "beforeafter") {
        result =
`ФОРМАТ: БЫЛО → СТАЛО

БЫЛО:
${story}

ПЕРЕЛОМНЫЙ МОМЕНТ:
Что заставило вас посмотреть на ситуацию иначе?

ДЕЙСТВИЕ:
Что вы начали делать по-другому?

СТАЛО:
Что изменилось в вашем состоянии, действиях или результате?

ВЫВОД:
Какой урок можно передать ${audience}?`;
      }

      if (format === "case") {
        result =
`ФОРМАТ: КЕЙС

Контекст:
${story}

Проблема:
Что здесь было главным затруднением?

Решение:
Что было сделано?

Результат:
Что изменилось?

Инсайт:
Почему эта история может быть полезна ${audience}?`;
      }

      if (format === "stories") {
        result =
`ФОРМАТ: СТОРИС

Сторис 1 — зацепка:
"Сегодня поймала себя на мысли..."

Сторис 2 — ситуация:
${story}

Сторис 3 — эмоция:
Что вы почувствовали в этот момент?

Сторис 4 — поворот:
Что помогло вам увидеть ситуацию иначе?

Сторис 5 — вывод:
Какой смысл вы забрали?

Сторис 6 — вопрос аудитории:
"А у вас было такое?"`;
      }

      document.getElementById("result").innerText = result;
    }
  </script>

</body>
</html>
